name: Windows test build

# Portable test packages for isolated preview branches. This workflow
# never creates a tag or release and does not need a pull request. A build
# remains downloadable when a check fails; its manifest and the failed job
# retain that result for the human who will test it.
on:
  push:
    branches: [feat/overnight-integration, feat/workspace-followup, fix/character-gpu-coexistence, feat/viewport-ui-integration, feat/session-host-integration, feat/session-host-chat-integration, fix/viewport-toolbars-integration, build/windows-integration-20261106, fix/host-move-and-dropdowns, feat/persistent-profiles-and-chat, fix/profile-popup-bounds, feat/compact-host-integration, feat/foldurora-photo-branding, feat/foldurora-upstream-integration, fix/camera-controls-integration, feat/shared-chat-integration, feat/native-read-integration, fix/shared-chat-enter-integration, feat/attention-integration, fix/attention-windows-clippy, feat/attention-review-integration, fix/attention-review-windows, feat/monitor-runtime-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/build/inventory-windows-package-20261110'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: 1.99.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Prepare logs and verify source
        run: |
          New-Item -ItemType Directory -Force .scratch/windows-test-build | Out-Null
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') { throw 'Wrong source' }
          if (git status --porcelain --untracked-files=no) { throw 'Dirty source' }
          git merge-base --is-ancestor fa1581b607e95a1881feb57ae49996e31aacd3ba HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Missing reviewed Inventory integration' }
          if (git diff --name-only fa1581b607e95a1881feb57ae49996e31aacd3ba HEAD -- crates Cargo.toml Cargo.lock) { throw 'Product source differs from Inventory checkpoint' }
          if (Test-Path crates/aurora-viewer/src/session_host/frame_guard.rs) { throw 'Experimental host frame must be absent' }
          if ((git rev-parse 'HEAD:Cargo.lock').Trim() -ne '1200bfcd612ad1dfcbe5bac6ef213cf904290c2a') { throw 'Wrong canonical lock blob' }
          $lockText = [IO.File]::ReadAllText((Resolve-Path Cargo.lock).Path).Replace("`r`n", "`n")
          $lockHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($lockText))).ToLowerInvariant()
          if ($lockHash -ne 'e04f6814529802ba6469b9455294aabfcfbec989d0e271698b3723a04d682e32') { throw 'Checkout lock differs' }
          @{ commit='${{ github.sha }}'; tree=(git rev-parse 'HEAD^{tree}').Trim(); cargo_lock_sha256=$lockHash; native_acceptance='pending' } | ConvertTo-Json | Set-Content .scratch/windows-test-build/source.json -Encoding utf8NoBOM
      - name: Compatible Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version
          cargo --version
      - uses: ./.github/actions/rust-cache
        with:
          name: tests
      - name: PowerShell parser
        id: scripts
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/check-scripts.ps1 2>&1 | Tee-Object .scratch/windows-test-build/scripts.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Formatting
        id: format
        run: cargo fmt --all -- --check
      - name: Strict workspace Clippy
        id: clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | Tee-Object .scratch/windows-test-build/clippy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: List every compiled test
        id: list
        env:
          AURORA_RENDER_THREAD: '1'
          AURORA_GPU_VALIDATION: '1'
        run: |
          cargo test --workspace --locked -- --list 2>&1 | Tee-Object .scratch/windows-test-build/list.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unfiltered workspace tests
        id: tests
        env:
          AURORA_RENDER_THREAD: '1'
          AURORA_GPU_VALIDATION: '1'
        run: |
          cargo test --workspace --locked --no-fail-fast 2>&1 | Tee-Object .scratch/windows-test-build/tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Audit complete source-bound test coverage
        id: audit
        shell: python
        run: |
          import collections, json, pathlib, re, subprocess
          root = pathlib.Path('.scratch/windows-test-build')
          def rows(filename, listing):
              binary = None
              found = collections.defaultdict(list)
              for line in (root / filename).read_text(encoding='utf-8-sig').splitlines():
                  line = line.strip()
                  match = re.search(r'Running .+\(([^)]+)\)$', line)
                  if match:
                      binary = 'bin:' + match[1].replace(chr(92), '/').rsplit('/', 1)[-1]
                      continue
                  match = re.fullmatch(r'Doc-tests\s+(\S+)', line)
                  if match:
                      binary = 'doc:' + match[1]
                      continue
                  match = re.fullmatch(r'(.+): test', line) if listing else re.fullmatch(r'test (.+) \.\.\. (ok|FAILED|ignored)(?:,.*)?', line)
                  if match:
                      if binary is None:
                          raise SystemExit('Test row has no source binary: ' + line)
                      name = re.sub(r' - should panic$', '', match[1])
                      found[(binary, name)].append('listed' if listing else match[2])
              return found
          expected, actual = rows('list.log', True), rows('tests.log', False)
          if not expected or set(expected) != set(actual):
              raise SystemExit('Compiled-list/full-run test names differ')
          if any(len(v) != 1 for v in expected.values()) or any(len(v) != 1 or v[0] not in ('ok', 'ignored') for v in actual.values()):
              raise SystemExit('Duplicate, missing or failing test outcome')
          required = [
              'inventory_new_window_button_creates_instances_in_both_styles',
              'inventory_many_windows_keep_independent_state_and_lifetimes',
              'inventory_new_windows_cascade_without_moving_existing_views',
              'inventory_closed_windows_keep_pending_documents_and_confirmations_separate',
              'full_inventory_windows_drag_between_nonadjacent_instances',
              'full_inventory_windows_share_clipboard_with_nonadjacent_focused_destinations',
              'workspace_additional_role_coexists_with_fresh_full_windows_without_retargeting_or_closing_them',
              'workspace_explicit_capture_reselects_first_open_full_owner_but_preserves_retained_closed_documents',
          ]
          for name in required:
              matches = [v for (_, full), v in actual.items() if full.rsplit('::', 1)[-1] == name]
              if matches != [['ok']]:
                  raise SystemExit('Required Inventory case missing/nonpassing/duplicate: ' + name)
          if any(name.endswith('the_main_window_toggles_one_additional_inventory_window') for _, name in expected):
              raise SystemExit('Retired singleton behavior unexpectedly present')
          totals = collections.Counter(v[0] for v in actual.values())
          report = {'source': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'compiled_names': len(expected), 'passed': totals['ok'], 'failed': 0, 'ignored': totals['ignored'],
                    'inventory_required': required, 'inventory_passed_exactly_once': len(required),
                    'scope': 'Every current Windows-compiled test matched exactly once in the unfiltered run; native/human/GPU acceptance pending.'}
          (root / 'test-audit.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
      - name: Build viewer and sidecar
        id: build
        run: |
          cargo build --locked -p aurora-viewer -p aurora-mcp --features aurora-viewer/xr-static-loader 2>&1 | Tee-Object .scratch/windows-test-build/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify versions and package
        id: package
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}' -or (git status --porcelain --untracked-files=no)) { throw 'Source changed' }
          $short = (git rev-parse --short=9 HEAD).Trim()
          $version = (& ./target/debug/aurora-viewer.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch ('\.g' + [Regex]::Escape($short) + '$')) { throw 'Viewer source stamp mismatch' }
          $sidecar = (& ./target/debug/foldurora-mcp.exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $sidecar -notmatch '^foldurora-mcp \d+\.\d+\.\d+') { throw 'Sidecar version mismatch' }
          & ./target/debug/foldurora-mcp.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Sidecar help failed' }
          $name = "Foldurora-inventory-$($actual.Substring(0,12))-windows-x64"
          $out = Join-Path .scratch/windows-test-build $name
          ./scripts/package.ps1 -Exe target/debug/aurora-viewer.exe -McpExe target/debug/foldurora-mcp.exe -Out $out
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          $hashes = @{}
          foreach ($exe in 'aurora-viewer.exe', 'foldurora-mcp.exe') {
            $built = (Get-FileHash -Algorithm SHA256 "target/debug/$exe").Hash.ToLowerInvariant()
            $staged = (Get-FileHash -Algorithm SHA256 (Join-Path $out $exe)).Hash.ToLowerInvariant()
            if ($built -ne $staged) { throw "Staged executable differs: $exe" }
            $hashes[$exe] = $built
          }
          foreach ($file in 'aurora-install.json','FOLDURORA_MCP.md','NOTICE-MCP.txt','LICENSE','NOTICE.md') {
            if (-not (Test-Path (Join-Path $out $file))) { throw "Missing package file: $file" }
          }
          $manifest = @{ commit=$actual; tree=(git rev-parse 'HEAD^{tree}').Trim(); profile='dev'; viewer=$version; sidecar=$sidecar; executable_sha256=$hashes; inventory_source='fa1581b607e95a1881feb57ae49996e31aacd3ba'; monitor_enabled=$true; xr_static_loader=$true; host_frame_repair_enabled=$false; human_acceptance='pending'; tests=(Get-Content .scratch/windows-test-build/test-audit.json -Raw | ConvertFrom-Json) }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $out foldurora-build-info.json) -Encoding utf8NoBOM
          $zip = Join-Path .scratch/windows-test-build "$name.zip"
          Compress-Archive -LiteralPath $out -DestinationPath $zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try {
            foreach ($exe in 'aurora-viewer.exe', 'foldurora-mcp.exe') {
              $entries = @($archive.Entries | Where-Object { $_.FullName.EndsWith("/$exe") -or $_.FullName -eq $exe })
              if ($entries.Count -ne 1) { throw "ZIP executable missing/duplicate: $exe" }
              $stream = $entries[0].Open()
              $sha = [Security.Cryptography.SHA256]::Create()
              try { $hash = [Convert]::ToHexString($sha.ComputeHash($stream)).ToLowerInvariant() } finally { $sha.Dispose(); $stream.Dispose() }
              if ($hash -ne $hashes[$exe]) { throw "ZIP executable differs: $exe" }
            }
          } finally { $archive.Dispose() }
          $zipHash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$zipHash  $name.zip" | Set-Content "$zip.sha256" -Encoding utf8NoBOM
          $manifest | ConvertTo-Json -Depth 8 | Set-Content .scratch/windows-test-build/build-manifest.json -Encoding utf8NoBOM
          "package=$name.zip" >> $env:GITHUB_OUTPUT
          "## Inventory-only Windows test package`n$version`nSHA-256: $zipHash`nNative/human acceptance pending; host styling repair is absent." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload test package or failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Foldurora-inventory-windows-${{ github.sha }}
          path: |
            .scratch/windows-test-build/*.zip
            .scratch/windows-test-build/*.sha256
            .scratch/windows-test-build/*.json
            .scratch/windows-test-build/*.log
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  linux:
    # Real root/euid-owned ancestry is needed for native file-security tests;
    # the managed sandbox's mapped read-only root is deliberately refused.
    # Keep the existing maintainer CI profile and strict filesystem policy.
    if: github.ref == 'refs/heads/feat/monitor-runtime-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Prepare Linux logs
        run: mkdir -p .scratch/linux-test-build
      - name: Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev fonts-noto-cjk
      - name: Rust stable
        run: |
          rustup update stable --no-self-update
          rustup component add rustfmt clippy
      - name: Linux formatting
        id: format
        continue-on-error: true
        run: cargo fmt --all -- --check 2>&1 | tee .scratch/linux-test-build/format.log
      - name: Qualified Linux Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --profile ci --workspace --all-targets --locked -- -D warnings -A dead_code 2>&1 | tee .scratch/linux-test-build/clippy.log
      - name: Full Linux workspace tests
        id: tests
        continue-on-error: true
        run: cargo test --profile ci --workspace --locked --no-fail-fast 2>&1 | tee .scratch/linux-test-build/tests.log
      - name: Record Linux provenance
        if: always()
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FORMAT_RESULT: ${{ steps.format.outcome }}
          CLIPPY_RESULT: ${{ steps.clippy.outcome }}
          TESTS_RESULT: ${{ steps.tests.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          clean = not subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], text=True).strip()
          checks = {name: os.environ[name] for name in ('FORMAT_RESULT', 'CLIPPY_RESULT', 'TESTS_RESULT')}
          manifest = {'commit': source, 'expected_commit': os.environ['SOURCE_COMMIT'], 'source_clean': clean,
                      'workflow_run': os.environ['RUN_URL'], 'profile': 'ci', 'target': 'x86_64-unknown-linux-gnu',
                      'checks': checks, 'all_checks_passed': source == os.environ['SOURCE_COMMIT'] and clean and all(value == 'success' for value in checks.values()),
                      'scope': 'Linux formatting, qualified Clippy and full workspace tests; no native Windows, human/grid or release acceptance.'}
          pathlib.Path('.scratch/linux-test-build/build-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Upload Linux diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Foldurora-linux-checks-${{ github.sha }}
          path: .scratch/linux-test-build/
          if-no-files-found: error
          retention-days: 7
      - name: Require Linux green checks
        if: always()
        env:
          FORMAT_RESULT: ${{ steps.format.outcome }}
          CLIPPY_RESULT: ${{ steps.clippy.outcome }}
          TESTS_RESULT: ${{ steps.tests.outcome }}
        run: |
          python3 - <<'PY'
          import json, pathlib
          manifest = json.loads(pathlib.Path('.scratch/linux-test-build/build-manifest.json').read_text())
          if not manifest['all_checks_passed']:
              raise SystemExit('Linux checks failed or did not run; inspect the retained manifest and raw logs.')
          PY
