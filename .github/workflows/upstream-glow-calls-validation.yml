name: Baseline control for existing UI fixture failures
on:
  push:
    branches: [checks/upstream-glow-calls-20261108]
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: isolated-glow-calls-validation
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  SOURCE_SHA: 388b299c429d776b3fc7a9890162cd3d940b9dc3
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout the unchanged public base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 388b299c429d776b3fc7a9890162cd3d940b9dc3
          fetch-depth: 0
          filter: blob:none
      - name: Source and compiler identity
        run: |
          mkdir -p .scratch/baseline
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD | tee .scratch/baseline/source.txt
          echo "$GITHUB_SHA" > .scratch/baseline/workflow.txt
          rustc --version | tee .scratch/baseline/rust.txt
          cargo --version | tee .scratch/baseline/cargo.txt
      - name: Existing CI libraries and cache
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: ./.github/actions/rust-cache
        with:
          name: linux-tests
      - name: Reproduce only the four unchanged failures
        run: |
          names=(
            crash::window::tests::a_device_loss_without_a_trace_displays_and_copies_the_saved_summary
            crash::window::tests::a_recovered_trace_keeps_precedence_in_details_and_clipboard
            session_host::native::tests::host_overlay_collection_covers_live_tooltips_and_bounds_excess_area_count
            session_host::native::tests::host_popup_islands_follow_real_combo_paint_and_disappear_when_it_closes
          )
          index=0
          for name in "${names[@]}"; do
            index=$((index+1))
            log=".scratch/baseline/case-$index.log"
            set +e
            cargo test --profile ci --workspace --locked "$name" -- --exact > "$log" 2>&1
            result=$?
            set -e
            cat "$log"
            python3 - "$name" "$log" "$result" <<'PY'
          import pathlib,sys
          name,path,result=sys.argv[1:]
          log=pathlib.Path(path).read_text()
          assert result=='101',(name,'unexpected Cargo exit',result)
          assert 'test '+name+' ... FAILED' in log,(name,'case did not execute')
          assert 'Dropped TexturesDelta with 1 unapplied deltas.' in log,(name,'different failure')
          with pathlib.Path('.scratch/baseline/expected-failures.txt').open('a') as out:
            out.write(name+' : expected unchanged TexturesDelta failure'+chr(10))
          PY
          done
      - name: Verify unchanged source
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code
      - name: Upload raw baseline evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: glow-calls-base-388b299c
          path: .scratch/baseline/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
