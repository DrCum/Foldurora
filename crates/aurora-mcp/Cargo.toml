[package]
name = "aurora-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aurora-session = { path = "../aurora-session" }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", default-features = false, features = ["rt", "io-std", "io-util", "sync", "time"] }
uuid = { version = "1.27.0", features = ["v4"] }
directories = "6.0.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Memory"] }

[lints]
workspace = true

[[bin]]
name = "foldurora-mcp"
path = "src/main.rs"
